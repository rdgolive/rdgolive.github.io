<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор стоимости услуги</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 w-100" style="max-width: 480px;">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Калькулятор стоимости услуги</h1>

        <form id="service-form">
          <div class="mb-3">
            <label for="quantity" class="form-label">Количество</label>
            <input id="quantity" name="quantity" type="text" class="form-control" value="1" autocomplete="off">
          </div>

          <fieldset class="mb-3">
            <legend class="form-label fs-6">Тип услуги</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="serviceType" id="type1" value="1" checked>
              <label class="form-check-label" for="type1">Базовая услуга — 500 ₽</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="serviceType" id="type2" value="2">
              <label class="form-check-label" for="type2">Услуга с опциями — 800 ₽</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="serviceType" id="type3" value="3">
              <label class="form-check-label" for="type3">Услуга со свойством — 1000 ₽</label>
            </div>
          </fieldset>

          <div id="options-block" class="mb-3 d-none">
            <label for="serviceOption" class="form-label">Опция</label>
            <select id="serviceOption" name="serviceOption" class="form-select">
              <option value="0">Без опции</option>
              <option value="150">Опция A — +150 ₽</option>
              <option value="300">Опция B — +300 ₽</option>
            </select>
          </div>

          <div id="property-block" class="mb-3 d-none">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="serviceProperty" name="serviceProperty" value="200">
              <label class="form-check-label" for="serviceProperty">Свойство — +200 ₽</label>
            </div>
          </div>
        </form>

        <p id="error" class="text-danger small mt-3 mb-0" role="alert"></p>
        <p id="result" class="fw-semibold mt-2 mb-0" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js" defer></script>
</body>
</html>
